<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="월별 제철 재료로 오늘의 메뉴를 추천받는 웹서비스" />
  <title>오늘 뭐먹지? | 제철 식단 추천</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap');

    :root {
      --ink: #26231f;
      --muted: #756f65;
      --paper: #f8f3e9;
      --card: #fffdf8;
      --green: #385b3f;
      --green-deep: #24452e;
      --orange: #d96d3c;
      --line: rgba(56, 91, 63, .18);
      --shadow: 0 18px 50px rgba(63, 49, 33, .1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 6%, rgba(236, 173, 101, .18), transparent 25rem),
        radial-gradient(circle at 92% 30%, rgba(92, 134, 85, .13), transparent 28rem),
        var(--paper);
      font-family: "Gowun Dodum", system-ui, sans-serif;
      line-height: 1.6;
    }

    button, select { font: inherit; }
    button { color: inherit; }

    .page-shell {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 44px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50% 45% 52% 42%;
      color: #fff;
      background: var(--green);
      transform: rotate(-7deg);
    }

    .brand-mark span { transform: rotate(7deg); }

    .month-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .93rem;
    }

    .select-wrap { position: relative; }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 15px;
      top: 46%;
      color: var(--green);
      pointer-events: none;
      transform: translateY(-50%);
    }

    select {
      min-width: 112px;
      padding: 10px 40px 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      outline: none;
      color: var(--green-deep);
      background: rgba(255, 253, 248, .85);
      appearance: none;
      cursor: pointer;
      transition: box-shadow .2s, border-color .2s;
    }

    select:focus-visible {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(56, 91, 63, .12);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, .72fr);
      align-items: end;
      gap: 60px;
      padding-bottom: 50px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--orange);
      font-size: .87rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .eyebrow::before {
      content: "";
      width: 23px;
      height: 2px;
      background: currentColor;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 720px;
      margin-bottom: 22px;
      font-family: "Nanum Myeongjo", serif;
      font-size: clamp(2.9rem, 7vw, 5.8rem);
      line-height: 1.08;
      letter-spacing: -.07em;
    }

    h1 em {
      color: var(--green);
      font-style: normal;
    }

    .hero-copy {
      max-width: 590px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.13rem);
    }

    .month-visual {
      position: relative;
      min-height: 240px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 180px 180px 24px 24px;
      color: #fff;
      background:
        linear-gradient(155deg, rgba(23, 65, 39, .2), rgba(23, 65, 39, .72)),
        url("https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1000&q=85") center/cover;
      box-shadow: var(--shadow);
    }

    .month-stamp {
      position: absolute;
      right: 24px;
      bottom: 18px;
      font-family: "Nanum Myeongjo", serif;
      font-size: 4.8rem;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,.18);
    }

    .month-stamp small {
      font-family: "Gowun Dodum", sans-serif;
      font-size: 1rem;
      margin-left: 3px;
    }

    .ingredients-section { padding: 46px 0 32px; }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h2 {
      margin-bottom: 5px;
      font-family: "Nanum Myeongjo", serif;
      font-size: clamp(1.65rem, 3vw, 2.25rem);
      letter-spacing: -.04em;
    }

    .section-description, .result-count {
      margin-bottom: 0;
      color: var(--muted);
      font-size: .94rem;
    }

    .ingredient-list {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      min-height: 49px;
    }

    .ingredient-button {
      padding: 10px 19px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 248, .82);
      cursor: pointer;
      transition: transform .2s, color .2s, background .2s, border-color .2s, box-shadow .2s;
    }

    .ingredient-button:hover {
      border-color: var(--green);
      transform: translateY(-2px);
    }

    .ingredient-button:focus-visible {
      outline: 3px solid rgba(56, 91, 63, .22);
      outline-offset: 3px;
    }

    .ingredient-button[aria-pressed="true"] {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 8px 20px rgba(56, 91, 63, .22);
    }

    .recipes-section { padding-top: 24px; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .recipe-card {
      overflow: hidden;
      border: 1px solid rgba(56, 91, 63, .12);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 8px 24px rgba(63, 49, 33, .06);
      animation: card-in .45s both;
      cursor: pointer;
      transition: transform .22s, box-shadow .22s, border-color .22s;
    }

    .recipe-card:hover {
      border-color: rgba(56, 91, 63, .34);
      box-shadow: 0 16px 36px rgba(63, 49, 33, .12);
      transform: translateY(-5px);
    }

    .recipe-card:focus-visible {
      outline: 3px solid rgba(56, 91, 63, .3);
      outline-offset: 4px;
    }

    .recipe-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e8e4dc;
    }

    .card-body { padding: 20px 20px 22px; }

    .category {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--orange);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .recipe-card h3 {
      margin: 0;
      font-family: "Nanum Myeongjo", serif;
      font-size: 1.28rem;
      line-height: 1.45;
      letter-spacing: -.03em;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 13px;
      color: var(--green);
      font-size: .84rem;
      font-weight: 700;
    }

    .recipe-dialog {
      width: min(920px, calc(100% - 32px));
      max-height: min(88vh, 900px);
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 28px;
      color: var(--ink);
      background: var(--card);
      box-shadow: 0 28px 90px rgba(24, 31, 23, .3);
    }

    .recipe-dialog::backdrop {
      background: rgba(24, 31, 23, .68);
      backdrop-filter: blur(7px);
    }

    .dialog-scroll {
      max-height: min(88vh, 900px);
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .dialog-close-x {
      position: absolute;
      z-index: 2;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 50%;
      color: #fff;
      background: rgba(22, 31, 23, .56);
      font-size: 1.45rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .dialog-close-x:focus-visible,
    .dialog-close-button:focus-visible {
      outline: 3px solid rgba(217, 109, 60, .36);
      outline-offset: 3px;
    }

    .dialog-hero {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(300px, .9fr);
      min-height: 360px;
      background: #efe9dd;
    }

    .dialog-image {
      width: 100%;
      height: 100%;
      min-height: 360px;
      object-fit: cover;
      background: #e3ded4;
    }

    .dialog-summary {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 58px 46px 44px;
      background: var(--green-deep);
      color: #fff;
    }

    .dialog-kicker {
      margin-bottom: 14px;
      color: #d6b98c;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .dialog-title {
      margin: 0 0 28px;
      font-family: "Nanum Myeongjo", serif;
      font-size: clamp(2rem, 5vw, 3.35rem);
      line-height: 1.22;
      letter-spacing: -.05em;
    }

    .dialog-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
    }

    .dialog-meta div {
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .dialog-meta dt,
    .dialog-meta dd { display: inline; margin: 0; }
    .dialog-meta dt { color: rgba(255,255,255,.64); font-size: .8rem; }
    .dialog-meta dt::after { content: " · "; }

    .dialog-content {
      display: grid;
      gap: 34px;
      padding: 42px 48px 48px;
      overflow-wrap: anywhere;
    }

    .dialog-section h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
      font-family: "Nanum Myeongjo", serif;
      font-size: 1.35rem;
      letter-spacing: -.03em;
    }

    .dialog-section h3::before {
      content: "";
      width: 20px;
      height: 2px;
      background: var(--orange);
    }

    .ingredients-text {
      margin: 0;
      white-space: pre-line;
      color: #524d45;
    }

    .steps-list {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: recipe-step;
    }

    .steps-list li {
      position: relative;
      min-height: 36px;
      padding: 4px 0 4px 50px;
      counter-increment: recipe-step;
    }

    .steps-list li::before {
      content: counter(recipe-step);
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      font-size: .86rem;
      font-weight: 700;
    }

    .tip-box {
      margin: 0;
      padding: 20px 22px;
      border-radius: 18px;
      background: #f3ead6;
      color: #544933;
    }

    .dialog-footer { text-align: center; }

    .dialog-close-button {
      min-width: 140px;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      cursor: pointer;
    }

    .empty-state, .error-state {
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: 38px;
      border: 1px dashed rgba(56, 91, 63, .3);
      border-radius: 24px;
      text-align: center;
      background: rgba(255, 253, 248, .48);
    }

    .empty-state span, .error-state span {
      display: block;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .empty-state p, .error-state p { margin: 0; color: var(--muted); }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; gap: 34px; }
      .month-visual { min-height: 210px; }
      .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dialog-hero { grid-template-columns: 1fr; }
      .dialog-image { height: min(44vh, 360px); min-height: 260px; }
      .dialog-summary { padding: 36px 34px; }
    }

    @media (max-width: 560px) {
      .page-shell { width: min(100% - 28px, 1160px); padding-top: 18px; }
      .topbar { align-items: flex-start; margin-bottom: 32px; }
      .brand { font-size: .9rem; }
      .brand-mark { width: 34px; height: 34px; }
      .month-picker { align-items: flex-start; flex-direction: column; gap: 3px; }
      .hero { padding-bottom: 38px; }
      h1 { font-size: clamp(2.65rem, 16vw, 4.2rem); }
      .month-visual { min-height: 180px; }
      .month-stamp { font-size: 4rem; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 6px; }
      .recipe-grid { grid-template-columns: 1fr; }
      .ingredient-button { padding: 9px 16px; }
      .recipe-dialog { width: calc(100% - 18px); max-height: 94vh; border-radius: 22px; }
      .dialog-scroll { max-height: 94vh; }
      .dialog-image { min-height: 220px; }
      .dialog-summary { padding: 30px 24px; }
      .dialog-title { margin-bottom: 20px; }
      .dialog-content { gap: 28px; padding: 32px 24px 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div class="brand" aria-label="오늘 뭐먹지?">
        <span class="brand-mark" aria-hidden="true"><span>旬</span></span>
        오늘 뭐먹지?
      </div>
      <label class="month-picker" for="monthSelect">
        <span>제철 월 선택</span>
        <span class="select-wrap">
          <select id="monthSelect" aria-label="월 선택"></select>
        </span>
      </label>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <div>
        <p class="eyebrow">SEASONAL TABLE</p>
        <h1 id="heroTitle">오늘은<br><em>제철로 먹자.</em></h1>
        <p class="hero-copy">가장 맛있을 때 만난 재료로, 오늘의 식탁을 가볍게 골라보세요. 월을 선택하고 마음이 가는 제철 재료를 누르면 어울리는 메뉴를 찾아드려요.</p>
      </div>
      <div class="month-visual" aria-hidden="true">
        <div class="month-stamp"><span id="monthStamp">--</span><small>월</small></div>
      </div>
    </section>

    <section class="ingredients-section" aria-labelledby="ingredientTitle">
      <div class="section-heading">
        <div>
          <h2 id="ingredientTitle"><span id="selectedMonthText">--월</span>의 제철 재료</h2>
          <p class="section-description">궁금한 재료 하나를 선택해 보세요.</p>
        </div>
      </div>
      <div id="ingredientList" class="ingredient-list" aria-live="polite"></div>
    </section>

    <section class="recipes-section" aria-labelledby="recipeTitle">
      <div class="section-heading">
        <div>
          <h2 id="recipeTitle">추천 메뉴</h2>
          <p id="recipeGuide" class="section-description">재료를 선택하면 메뉴를 보여드릴게요.</p>
        </div>
        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>
      <div id="recipeGrid" class="recipe-grid" aria-live="polite" aria-busy="true">
        <div class="empty-state"><div><span aria-hidden="true">🥬</span><p>제철 데이터를 불러오는 중이에요.</p></div></div>
      </div>
    </section>
  </main>

  <dialog id="recipeDialog" class="recipe-dialog" aria-labelledby="dialogTitle">
    <div id="dialogScroll" class="dialog-scroll">
      <button id="dialogCloseX" class="dialog-close-x" type="button" aria-label="팝업 닫기">×</button>
      <div class="dialog-hero">
        <img id="dialogImage" class="dialog-image" alt="" />
        <div class="dialog-summary">
          <p class="dialog-kicker">오늘의 제철 레시피</p>
          <h2 id="dialogTitle" class="dialog-title"></h2>
          <dl class="dialog-meta">
            <div><dt>요리종류</dt><dd id="dialogCategory"></dd></div>
            <div><dt>조리방법</dt><dd id="dialogMethod"></dd></div>
          </dl>
        </div>
      </div>
      <div class="dialog-content">
        <section class="dialog-section" aria-labelledby="ingredientsTitle">
          <h3 id="ingredientsTitle">재료</h3>
          <p id="dialogIngredients" class="ingredients-text"></p>
        </section>
        <section class="dialog-section" aria-labelledby="stepsTitle">
          <h3 id="stepsTitle">조리순서</h3>
          <ol id="dialogSteps" class="steps-list"></ol>
        </section>
        <aside id="dialogTip" class="tip-box" hidden></aside>
        <div class="dialog-footer">
          <button id="dialogCloseButton" class="dialog-close-button" type="button">닫기</button>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    const monthSelect = document.querySelector('#monthSelect');
    const monthStamp = document.querySelector('#monthStamp');
    const selectedMonthText = document.querySelector('#selectedMonthText');
    const ingredientList = document.querySelector('#ingredientList');
    const recipeGrid = document.querySelector('#recipeGrid');
    const recipeGuide = document.querySelector('#recipeGuide');
    const resultCount = document.querySelector('#resultCount');
    const recipeDialog = document.querySelector('#recipeDialog');
    const dialogScroll = document.querySelector('#dialogScroll');
    const dialogImage = document.querySelector('#dialogImage');
    const dialogTitle = document.querySelector('#dialogTitle');
    const dialogCategory = document.querySelector('#dialogCategory');
    const dialogMethod = document.querySelector('#dialogMethod');
    const dialogIngredients = document.querySelector('#dialogIngredients');
    const dialogSteps = document.querySelector('#dialogSteps');
    const dialogTip = document.querySelector('#dialogTip');
    const dialogCloseX = document.querySelector('#dialogCloseX');
    const dialogCloseButton = document.querySelector('#dialogCloseButton');
    let lastFocusedCard = null;

    const state = {
      data: null,
      month: new Date().getMonth() + 1,
      ingredient: null
    };

    const seasons = {
      1: '한겨울', 2: '늦겨울', 3: '초봄', 4: '봄',
      5: '늦봄', 6: '초여름', 7: '한여름', 8: '늦여름',
      9: '초가을', 10: '가을', 11: '늦가을', 12: '한겨울'
    };

    function setupMonthSelect() {
      monthSelect.innerHTML = Array.from({ length: 12 }, (_, index) => {
        const month = index + 1;
        return `<option value="${month}">${month}월 · ${seasons[month]}</option>`;
      }).join('');
      monthSelect.value = String(state.month);
    }

    function renderMonth() {
      monthStamp.textContent = String(state.month).padStart(2, '0');
      selectedMonthText.textContent = `${state.month}월`;
    }

    function renderIngredients() {
      const ingredients = state.data.seasonal.filter(item => item.month === state.month);
      ingredientList.replaceChildren(...ingredients.map(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ingredient-button';
        button.textContent = item.name;
        button.dataset.ingredient = item.name;
        button.setAttribute('aria-pressed', String(item.name === state.ingredient));
        button.addEventListener('click', () => selectIngredient(item.name));
        return button;
      }));
    }

    function selectIngredient(name) {
      state.ingredient = name;
      document.querySelectorAll('.ingredient-button').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.ingredient === name));
      });
      renderRecipes();
    }

    function createRecipeCard(recipe, index) {
      const article = document.createElement('article');
      article.className = 'recipe-card';
      article.style.animationDelay = `${Math.min(index * 45, 360)}ms`;
      article.tabIndex = 0;
      article.setAttribute('role', 'button');
      article.setAttribute('aria-label', `${recipe.name} 상세 레시피 보기`);

      const image = document.createElement('img');
      image.src = recipe.image;
      image.alt = `${recipe.name} 사진`;
      image.loading = 'lazy';
      image.addEventListener('error', () => {
        image.alt = '요리 사진을 불러오지 못했습니다.';
        image.removeAttribute('src');
      }, { once: true });

      const body = document.createElement('div');
      body.className = 'card-body';
      const category = document.createElement('span');
      category.className = 'category';
      category.textContent = recipe.category || '요리';
      const title = document.createElement('h3');
      title.textContent = recipe.name;
      const action = document.createElement('span');
      action.className = 'card-action';
      action.textContent = '레시피 보기 →';
      body.append(category, title, action);
      article.append(image, body);
      article.addEventListener('click', () => openRecipeDialog(recipe, article));
      article.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openRecipeDialog(recipe, article);
        }
      });
      return article;
    }

    function openRecipeDialog(recipe, trigger) {
      lastFocusedCard = trigger;
      dialogImage.src = recipe.image || '';
      dialogImage.alt = `${recipe.name} 큰 사진`;
      dialogTitle.textContent = recipe.name;
      dialogCategory.textContent = recipe.category || '요리';
      dialogMethod.textContent = recipe.method || '정보 없음';
      dialogIngredients.textContent = recipe.ingredients_text || '재료 정보가 없습니다.';

      const steps = Array.isArray(recipe.steps) ? recipe.steps.filter(Boolean) : [];
      dialogSteps.replaceChildren(...steps.map(step => {
        const item = document.createElement('li');
        item.textContent = step;
        return item;
      }));

      const hasTip = typeof recipe.tip === 'string' && recipe.tip.trim();
      dialogTip.hidden = !hasTip;
      dialogTip.textContent = hasTip ? `💡 ${recipe.tip.trim()}` : '';
      recipeDialog.showModal();
      dialogScroll.scrollTop = 0;
      dialogCloseX.focus();
    }

    function closeRecipeDialog() {
      recipeDialog.close();
    }

    function withDirectionalParticle(word) {
      const lastCode = word.charCodeAt(word.length - 1);
      const jongseong = (lastCode - 0xAC00) % 28;
      const particle = jongseong === 0 || jongseong === 8 ? '로' : '으로';
      return `${word}${particle}`;
    }

    function renderRecipes() {
      recipeGrid.setAttribute('aria-busy', 'false');

      if (!state.ingredient) {
        recipeGuide.textContent = '재료를 선택하면 메뉴를 보여드릴게요.';
        resultCount.textContent = '';
        recipeGrid.innerHTML = '<div class="empty-state"><div><span aria-hidden="true">🥄</span><p>위에서 먹고 싶은 제철 재료를 골라주세요.</p></div></div>';
        return;
      }

      const recipes = state.data.recipes.filter(recipe =>
        Array.isArray(recipe.seasonal) && recipe.seasonal.includes(state.ingredient) &&
        Array.isArray(recipe.months) && recipe.months.includes(state.month)
      );

      recipeGuide.textContent = `${withDirectionalParticle(state.ingredient)} 차리는 ${state.month}월의 식탁이에요.`;
      resultCount.textContent = `총 ${recipes.length}가지`;

      if (!recipes.length) {
        recipeGrid.innerHTML = `<div class="empty-state"><div><span aria-hidden="true">🍽️</span><p><strong>${state.ingredient}</strong>으로 만들 수 있는 ${state.month}월 레시피가 아직 없어요.<br>다른 제철 재료를 선택해 보세요.</p></div></div>`;
        return;
      }

      recipeGrid.replaceChildren(...recipes.map(createRecipeCard));
    }

    function changeMonth(month) {
      state.month = month;
      state.ingredient = null;
      renderMonth();
      renderIngredients();
      renderRecipes();
    }

    async function loadMenu() {
      try {
        const response = await fetch('./menu.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data.seasonal) || !Array.isArray(data.recipes)) {
          throw new Error('올바르지 않은 데이터 구조');
        }
        state.data = data;
        changeMonth(state.month);
      } catch (error) {
        console.error('menu.json을 불러오지 못했습니다:', error);
        recipeGrid.setAttribute('aria-busy', 'false');
        ingredientList.innerHTML = '<p class="section-description">재료 데이터를 불러오지 못했어요.</p>';
        recipeGrid.innerHTML = '<div class="error-state"><div><span aria-hidden="true">⚠️</span><p><strong>메뉴 데이터를 불러오지 못했어요.</strong><br>이 폴더에서 로컬 서버를 실행한 뒤 다시 열어주세요.</p></div></div>';
      }
    }

    monthSelect.addEventListener('change', event => changeMonth(Number(event.target.value)));
    dialogCloseX.addEventListener('click', closeRecipeDialog);
    dialogCloseButton.addEventListener('click', closeRecipeDialog);
    recipeDialog.addEventListener('click', event => {
      if (event.target === recipeDialog) closeRecipeDialog();
    });
    recipeDialog.addEventListener('close', () => {
      lastFocusedCard?.focus();
    });
    setupMonthSelect();
    renderMonth();
    loadMenu();
  </script>
</body>
</html>
